# Application with protected credential files and manual connection settings.
# Parser fixture; invented pins and identities are unsuitable for live apply.
# The UUID, image digests, endpoints, and model are test values.

apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: application-container
  uid: c8fd820d-fbc6-48ac-b4c7-240b92313689
spec:
  gateway:
    management: managed
    runtime:
      provider: docker
    endpoint: http://127.0.0.1:17681
    engine: unix:///var/run/docker.sock
    image: ghcr.io/nvidia/openshell/gateway@sha256:ea14aa4db0980fab4769fb6b5509ac42ae3dc8495e645b1ba1fe1ada49892fa6
    networkCIDR: 172.29.230.0/24
  inferenceProviders:
    - name: agent-model
      provider: openai
      endpoint: https://inference.example.invalid/v1
      credential: {env: AGENT_INFERENCE_API_KEY}
  sandboxes:
    - name: assistant
      image:
        ref: example.invalid/fabric-openclaw@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      network:
        tier: isolated
      harness:
        kind: nvidia.fabric.openclaw
      agent:
        name: main
        inference:
          routes:
            - name: primary
              providerRef: agent-model
              overrides:
                model: qualification-model
  services:
    voice:
      kind: container
      image: example.invalid/application@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      publication:
        bindAddress: 127.0.0.1
        port: 18790
      container:
        cpuLimitMillis: 2000
        memoryLimitGiB: 2
      port: 18790
      readiness:
        path: /health
      # Proposed VoiceClaw settings, interpreted only by the application image.
      environment:
        VOICECLAW_PORT: "18790"
        VOICECLAW_GATEWAY_URL: http://172.29.230.2:17681
        VOICECLAW_WORKSPACE: nc-example-workspace
        VOICECLAW_SANDBOX_NAME: assistant
        VOICECLAW_SANDBOX_ID: 11111111-2222-3333-4444-555555555555
        VOICECLAW_AGENT_NAME: main
        VOICECLAW_AUTH_MODE: none
        VOICECLAW_SPEECH_KEY_FILE: /run/nemoclaw/secrets/speech
      data:
        mountPath: /var/lib/application
      secrets:
        speech: {env: NVIDIA_API_KEY}
