# Basic application parser fixture; invented pins are unsuitable for live apply.
# The endpoints, UUID, image digests, model, and network are test values.

apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: application-container
  uid: c8fd820d-fbc6-48ac-b4c7-240b92313689
spec:
  gateway:
    management: external
    runtime:
      provider: docker
    endpoint: https://openshell.example.invalid:8443
    engine: unix:///var/run/docker.sock
    credential: {env: OPENSHELL_OPERATOR_TOKEN}
  inferenceProviders:
    - name: agent-model
      provider: openai
      endpoint: https://inference.example.invalid/v1
      credential: {env: AGENT_INFERENCE_API_KEY}
  sandboxes:
    - name: assistant
      image:
        ref: example.invalid/fabric-openclaw@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      network:
        tier: isolated
      harness:
        kind: nvidia.fabric.openclaw
      agent:
        name: main
        inference:
          routes:
            - name: primary
              providerRef: agent-model
              overrides:
                model: qualification-model
  services:
    voice:
      kind: container
      image: example.invalid/application@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      imagePullPolicy: Never
      architecture: arm64
      user: "65532:65532"
      placement:
        engine: unix:///var/run/docker.sock
        networkCIDR: 172.29.230.0/24
      publication:
        bindAddress: 127.0.0.1
        port: 18790
      # APP_* settings are examples interpreted by the application image.
      environment:
        APP_MODE: qualification
        APP_STATE_PATH: /var/lib/application/state/state.db
      data:
        mountPath: /var/lib/application
      readiness:
        startupTimeoutSeconds: 300
