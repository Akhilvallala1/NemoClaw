# Application with protected inputs and an agent connection; parser fixture; invented pins are unsuitable for live apply.
# The UUID, image digests, endpoints, and model are test values.

apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: application-container
  uid: c8fd820d-fbc6-48ac-b4c7-240b92313689
spec:
  gateway:
    management: managed
    runtime:
      provider: docker
    endpoint: http://127.0.0.1:17681
    engine: unix:///var/run/docker.sock
    image: ghcr.io/nvidia/openshell/gateway@sha256:ea14aa4db0980fab4769fb6b5509ac42ae3dc8495e645b1ba1fe1ada49892fa6
    networkCIDR: 172.29.230.0/24
  inferenceProviders:
    - name: agent-model
      provider: openai
      endpoint: https://inference.example.invalid/v1
      credential: {env: AGENT_INFERENCE_API_KEY}
  sandboxes:
    - name: assistant
      image:
        ref: example.invalid/fabric-openclaw@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      network:
        tier: isolated
      harness:
        kind: nvidia.fabric.openclaw
      agent:
        name: main
        inference:
          routes:
            - name: primary
              providerRef: agent-model
              overrides:
                model: qualification-model
  services:
    voice:
      kind: container
      image: example.invalid/application@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      publication:
        bindAddress: 127.0.0.1
        port: 18790
      # APP_* settings are examples interpreted by the application image.
      environment:
        APP_AGENT_CONNECTION_FILE: /run/nemoclaw/agent-connection.json
        APP_CREDENTIAL_FILE: /run/nemoclaw/secrets/speech
      data:
        mountPath: /var/lib/application
      secrets:
        speech: {env: NVIDIA_API_KEY}
        openshell: {env: APP_OPENSHELL_SERVICE_TOKEN}
      agentConnection:
        sandboxRef: assistant
        gatewayEndpoint: https://openshell.example.invalid:8443
        authentication:
          mode: oidcBearer
          secretRef: openshell
