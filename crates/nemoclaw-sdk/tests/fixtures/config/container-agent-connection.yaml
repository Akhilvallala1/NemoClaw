# Complete parser fixture, not a deployable or qualified application recipe.
# The endpoints, UUID, image digests, model, and network are test values.

apiVersion: nemoclaw.nvidia.com/v1alpha1
kind: NemoClawConfig
metadata:
  name: application-manual-test
  uid: c8fd820d-fbc6-48ac-b4c7-240b92313689
spec:
  gateway:
    management: external
    runtime:
      provider: docker
    endpoint: https://openshell.example.invalid:8443
    engine: unix:///var/run/docker.sock
    credential: {env: OPENSHELL_OPERATOR_TOKEN}
  inferenceProviders:
    - name: agent-model
      provider: openai
      endpoint: https://inference.example.invalid/v1
      credential: {env: AGENT_INFERENCE_API_KEY}
  sandboxes:
    - name: assistant
      image:
        ref: example.invalid/fabric-openclaw@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      network:
        tier: isolated
      harness:
        kind: nvidia.fabric.openclaw
      agent:
        name: main
        inference:
          routes:
            - name: primary
              providerRef: agent-model
              overrides:
                model: qualification-model
  services:
    voice:
      kind: container
      image: example.invalid/application@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      imagePullPolicy: Never
      inputSetup:
        image: example.invalid/container-inputs@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      architecture: arm64
      user: "65532:65532"
      placement:
        engine: unix:///var/run/docker.sock
        networkCIDR: 172.29.230.0/24
      publication:
        bindAddress: 127.0.0.1
        port: 18790
      # APP_* settings are examples interpreted by the application image.
      environment:
        APP_MODE: qualification
        APP_AGENT_CONNECTION_FILE: /var/lib/application/config/agent-connection.json
        APP_CREDENTIAL_FILE: /var/lib/application/credentials/speech
        APP_STATE_PATH: /var/lib/application/state/state.db
      data:
        mountPath: /var/lib/application
      secrets:
        speech:
          credential: {env: NVIDIA_API_KEY}
          targetPath: /var/lib/application/credentials/speech
        openshell:
          credential: {env: APP_OPENSHELL_SERVICE_TOKEN}
          targetPath: /var/lib/application/credentials/openshell
      agentConnections:
        primary:
          sandboxRef: assistant
          agent: main
          targetPath: /var/lib/application/config/agent-connection.json
          gatewayEndpoint: https://openshell.example.invalid:8443
          authentication:
            mode: oidcBearer
            secretRef: openshell
            refreshMode: none
          tls:
            trust: system
          timeouts:
            healthSeconds: 12
            invokeSeconds: 120
      readiness:
        startupTimeoutSeconds: 300
