# Replace the fixture endpoint/model with your own compatible service.
# See docs/reference/fabric-harnesses.md for protocol requirements and test commands.
apiVersion: nemoclaw.nvidia.com/v1alpha2
kind: NemoClawConfig
metadata:
  name: fabric-remote-agent
  uid: e1b40bdf-b151-4259-b6b7-63b083ae071b
spec:
  gateway:
    management: external
    endpoint: http://127.0.0.1:17681
    target:
      docker: {}
  inferenceProviders:
    local:
      provider: openai
      endpoint: http://172.20.0.1:11446/v1
  sandboxes:
    assistant:
      image:
        ref: nc-prototype-fabric@sha256:a60d580895c1667bddd2063078837134eb5cc7fea73aea7b0b6a55a4fa89204a
      network:
        tier: isolated
      harness:
        kind: nvidia.fabric.remote-agent
      agent:
        name: main
        inference:
          routes:
            - name: primary
              providerRef: local
              overrides:
                model: fixture-model
